name: Cubux Security 3.0.18.7 Settings UX Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.18.7
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_18_7_INSTALL.zip
          rm -rf /tmp/cubux3187
          mkdir -p /tmp/cubux3187
          unzip -q CubuxAudit_3_0_18_7_INSTALL.zip -d /tmp/cubux3187
          cp -a /tmp/cubux3187/. .

      - name: Validate 3.0.18.7 scope
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java
          DB=app/src/main/java/com/cubux/audit/AuditDb.java
          AC=app/src/main/java/com/cubux/audit/AuditCoordinator.java

          grep -Fq "versionName '3.0.18.7'" app/build.gradle
          grep -Fq 'versionCode 60' app/build.gradle
          grep -Fq 'Cubux Security 3.0.18.7' "$MA"

          grep -Fq 'Только реальные параметры приложения' "$MA"
          grep -Fq 'Учётная запись Cubux' "$MA"
          grep -Fq 'Быстрая проверка' "$MA"
          grep -Fq 'Полная проверка' "$MA"
          grep -Fq 'Повторные попытки' "$MA"
          grep -Fq 'Пауза между запросами' "$MA"
          grep -Fq 'Системные уведомления' "$MA"
          grep -Fq 'Центр событий' "$MA"
          grep -Fq 'Резервная копия' "$MA"
          grep -Fq 'Восстановление' "$MA"
          grep -Fq 'Контроль периодов' "$MA"
          grep -Fq 'Диагностика' "$MA"
          grep -Fq 'openAndroidNotificationSettings' "$MA"
          grep -Fq 'confirmClearCredentials' "$MA"
          grep -Fq 'settingRow(String title,String value,String right,View.OnClickListener listener)' "$MA"

          SETTINGS_BLOCK=$(sed -n '/private View buildSettingsPage()/,/private String maskLogin/p' "$MA")
          if printf '%s' "$SETTINGS_BLOCK" | grep -Eq 'Telegram-отчёты|Ограничение ЦП|Работать только при зарядке|Путь к базе Cubux|Хранить 12 месяцев'; then
            echo 'VALIDATION FAILED: obsolete fake settings still exposed'
            exit 1
          fi

          grep -Fq 'String raw="●\u00A0"+caption+"\n"+value;' "$MA"
          grep -Fq 'v.setMaxLines(2);' "$MA"
          grep -Fq 'view.setGravity(Gravity.CENTER);' "$MA"

          grep -Fq 'String to=TimeUtil.yesterday();' "$AC"
          grep -Fq 'MIN_MS = 500L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' app/src/main/java/com/cubux/audit/DelayProfile.java

          if grep -Fq 'DROP TABLE' "$DB"; then
            echo 'VALIDATION FAILED: destructive database migration found'
            exit 1
          fi

          echo 'PASS: Cubux Security 3.0.18.7 settings and stat-card scope validated'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.18.7-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
