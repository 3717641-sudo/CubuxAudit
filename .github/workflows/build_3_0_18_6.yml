name: Cubux Security 3.0.18.6 Home Layout Refinement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.18.6
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_18_6_INSTALL.zip
          rm -rf /tmp/cubux3186
          mkdir -p /tmp/cubux3186
          unzip -q CubuxAudit_3_0_18_6_INSTALL.zip -d /tmp/cubux3186
          cp -a /tmp/cubux3186/. .

      - name: Validate 3.0.18.6 scope
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java
          DB=app/src/main/java/com/cubux/audit/AuditDb.java
          NH=app/src/main/java/com/cubux/audit/NotificationHelper.java
          AF=app/src/main/java/com/cubux/audit/AuditForegroundService.java
          DS=app/src/main/java/com/cubux/audit/DayControlService.java
          DE=app/src/main/java/com/cubux/audit/DayControlEngine.java
          CL=app/src/main/java/com/cubux/audit/CubuxLoader.java
          AC=app/src/main/java/com/cubux/audit/AuditCoordinator.java

          grep -Fq "versionName '3.0.18.6'" app/build.gradle
          grep -Fq 'versionCode 59' app/build.gradle
          grep -Fq 'Cubux Security 3.0.18.6' "$MA"

          grep -Fq 'informerCard.setMinimumHeight(dp(100))' "$MA"
          grep -Fq 'ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT' "$MA"
          grep -Fq 'db.recentRuns(3)' "$MA"
          grep -Fq 'String raw="●  "+caption+"\n"+value;' "$MA"
          grep -Fq 'v.setGravity(Gravity.CENTER);' "$MA"

          grep -Fq 'dayFinancialCard(summary)' "$MA"
          grep -Fq 'Доход:  ' "$MA"
          grep -Fq 'Расход:  ' "$MA"
          grep -Fq 'Записей:  ' "$MA"
          grep -Fq 'incomeTotal' "$DB"
          grep -Fq 'expenseTotal' "$DB"

          grep -Fq 'EXTRA_NOTIFICATION_TARGET' "$MA"
          grep -Fq 'onNewIntent(Intent intent)' "$MA"
          grep -Fq 'handleNotificationIntent(intent)' "$MA"

          grep -Fq 'Завершение проверки' "$MA"
          grep -Fq 'Резервная копия и итог' "$MA"

          grep -Fq 'String to=TimeUtil.yesterday();' "$AC"
          grep -Fq 'MIN_MS = 500L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' app/src/main/java/com/cubux/audit/DelayProfile.java

          if grep -Fq 'DROP TABLE' "$DB"; then
            echo 'VALIDATION FAILED: destructive database migration found'
            exit 1
          fi

          echo 'PASS: Cubux Security 3.0.18.6 Home layout + preserved 3.0.18.5 fixes'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.18.6-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
