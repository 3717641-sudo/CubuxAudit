name: Cubux Security 3.0.18.1 Startup Hotfix Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.18.1
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_18_1_INSTALL.zip
          rm -rf /tmp/cubux3181
          mkdir -p /tmp/cubux3181
          unzip -q CubuxAudit_3_0_18_1_INSTALL.zip -d /tmp/cubux3181
          cp -a /tmp/cubux3181/. .

      - name: Validate 3.0.18.1 startup hotfix
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java
          DB=app/src/main/java/com/cubux/audit/AuditDb.java
          AC=app/src/main/java/com/cubux/audit/AuditCoordinator.java

          grep -Fq "versionName '3.0.18.1'" app/build.gradle
          grep -Fq 'versionCode 54' app/build.gradle
          grep -Fq 'DB_VERSION=10' "$DB"
          grep -Fq 'Cubux Security 3.0.18.1' "$MA"

          # Critical startup fix: app_events columns must exist before create(db)
          # creates idx_app_events_seen(seen,id) while upgrading an older database.
          grep -Fq 'String[] pre={"ALTER TABLE app_events ADD COLUMN seen INTEGER NOT NULL DEFAULT 0"' "$DB"
          grep -Fq 'for(String x:pre)try{db.execSQL(x);}catch(Exception ignored){}create(db);' "$DB"
          grep -Fq 'CREATE INDEX IF NOT EXISTS idx_app_events_seen ON app_events(seen,id)' "$DB"

          # Upgrade must preserve the user's database.
          if grep -Fq 'DROP TABLE' "$DB"; then
            echo 'VALIDATION FAILED: destructive database migration found'
            exit 1
          fi

          # Stop/restart recovery for quick, full and scheduled checks.
          grep -Fq 'stopStaleRunningRuns' "$DB"
          grep -Fq 'recoverStoppedAuditUi' "$MA"
          grep -Fq 'if (!AuditRunGate.isRunning()) { recoverStoppedAuditUi();' "$MA"
          grep -Fq 'AuditRunGate.release();' "$AC"
          grep -Fq 'AuditControlRegistry.clear(control);' "$AC"

          # 3.0.18 day-control functionality remains present.
          grep -Fq 'Контроль дня' "$MA"
          grep -Fq 'Финальный контроль: 23:59' "$MA"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_snapshot' "$DB"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_events' "$DB"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_scans' "$DB"
          grep -Fq 'Центр событий' "$MA"

          # Main closed-day audit must still stop at yesterday.
          grep -Fq 'String to=TimeUtil.yesterday();' "$AC"
          grep -Fq 'MIN_MS = 500L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' app/src/main/java/com/cubux/audit/DelayProfile.java

          echo 'PASS: 3.0.18.1 startup migration and stop recovery are present'

      - name: Test legacy app_events migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3

          db = sqlite3.connect(':memory:')
          db.execute('''
            CREATE TABLE app_events(
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              created_at TEXT NOT NULL,
              level TEXT NOT NULL,
              source TEXT NOT NULL,
              message TEXT NOT NULL
            )
          ''')

          # The three columns are deliberately migrated before the new index.
          migrations = [
            "ALTER TABLE app_events ADD COLUMN seen INTEGER NOT NULL DEFAULT 0",
            "ALTER TABLE app_events ADD COLUMN category TEXT NOT NULL DEFAULT 'SYSTEM'",
            "ALTER TABLE app_events ADD COLUMN action TEXT NOT NULL DEFAULT 'EVENTS'",
          ]
          for sql in migrations:
              db.execute(sql)

          db.execute('CREATE INDEX IF NOT EXISTS idx_app_events_seen ON app_events(seen,id)')
          columns = {row[1] for row in db.execute('PRAGMA table_info(app_events)')}
          assert {'seen', 'category', 'action'} <= columns
          print('PASS: legacy app_events schema upgrades before idx_app_events_seen')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.18.1-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
