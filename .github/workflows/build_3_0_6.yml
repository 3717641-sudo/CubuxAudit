name: Cubux Security 3.0.6 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.6
        shell: bash
        run: |
          set -e
          test -f CubuxAudit_3_0_6_INSTALL.zip
          rm -rf /tmp/cubux306
          mkdir -p /tmp/cubux306
          unzip -q CubuxAudit_3_0_6_INSTALL.zip -d /tmp/cubux306
          cp -a /tmp/cubux306/. .

      - name: Validate 3.0.6 rules
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root=Path('.')
          def read(p): return (root/p).read_text(encoding='utf-8')
          def need(c,m):
              if not c: raise SystemExit('VALIDATION FAILED: '+m)

          bg=read('app/build.gradle')
          ma=read('app/src/main/java/com/cubux/audit/MainActivity.java')
          cs=read('app/src/main/java/com/cubux/audit/CheckScheduler.java')
          ar=read('app/src/main/java/com/cubux/audit/ScheduledAlarmReceiver.java')
          fg=read('app/src/main/java/com/cubux/audit/AuditForegroundService.java')
          mf=read('app/src/main/AndroidManifest.xml')
          db=read('app/src/main/java/com/cubux/audit/AuditDb.java')
          ae=read('app/src/main/java/com/cubux/audit/AuditEngine.java')
          co=read('app/src/main/java/com/cubux/audit/AuditCoordinator.java')
          sh=read('app/src/main/java/com/cubux/audit/StableHistoryLoader.java')
          nh=read('app/src/main/java/com/cubux/audit/NotificationHelper.java')

          need("versionName '3.0.6'" in bg and 'versionCode 41' in bg,'version mismatch')
          need('Cubux Security 3.0.6' in ma,'header version mismatch')
          need('detailsText.setMinLines(8)' in ma and 'detailsText.setMaxLines(8)' in ma,'fixed 8-line status missing')
          need('boldCurrentAction' in ma and 'Сейчас: ' in ma and 'StyleSpan(Typeface.BOLD)' in ma,'bold current-action accent missing')
          need('statusText.setVisibility(View.GONE)' in ma,'duplicated large stage title still visible')
          need('Автопроверка и автозапуск' in ma and 'showAutoStartSettings' in ma,'autostart settings section missing')
          need('setExactAndAllowWhileIdle' in cs and 'canScheduleExactAlarms' in cs,'exact alarm scheduling missing')
          need('SCHEDULE_EXACT_ALARM' in mf and '.ScheduledAlarmReceiver' in mf,'exact-alarm manifest wiring missing')
          need('startScheduled' in fg and 'AuditControlRegistry.attach(control,mode)' in fg,'background scheduled run/control bridge missing')
          need('Пауза' in fg and 'Продолжить' in fg and 'Стоп' in fg,'notification controls missing')
          need('account_name:' in db and 'AccountDirectory' in co,'account name mapping missing')
          need('is_expense' in ae and 'operation_type' in ae and 'payment_type' in ae,'income/expense fields missing')
          need('Не определён' in db and 't.equals("2")' in db,'operation type classification update missing')
          need('yesterday_changed_during_scan' in sh and 'YESTERDAY_CHANGED' in sh,'yesterday stability warning detection missing')
          need('showWarning' in nh and 'Визуально проверьте вчерашний день' in fg,'yesterday warning notification missing')
          print('PASS: Cubux Security 3.0.6 static rules')
          PYCODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cubux-tests
          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cubux-time-tests
          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-time-tests com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"
          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT
          printf '%s' "$CUBUX_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CUBUX_KEYSTORE_FILE"
          test -s "$CUBUX_KEYSTORE_FILE"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.6-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
