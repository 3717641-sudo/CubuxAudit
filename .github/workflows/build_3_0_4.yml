name: Cubux Security 3.0.4 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.4
        shell: bash
        run: |
          set -e
          test -f CubuxAudit_3_0_4_INSTALL.zip
          rm -rf /tmp/cubux304
          mkdir -p /tmp/cubux304
          unzip -q CubuxAudit_3_0_4_INSTALL.zip -d /tmp/cubux304
          cp -a /tmp/cubux304/. .
          test -f app/src/main/java/com/cubux/audit/MonthlyHistoryProbe.java
          test -f app/src/main/java/com/cubux/audit/StableHistoryLoader.java
          test -f app/src/main/java/com/cubux/audit/LightCheckEngine.java
          test -f app/src/main/java/com/cubux/audit/DelayProfile.java
          test -f app/src/main/java/com/cubux/audit/NetworkUtil.java
          test -f app/src/main/java/com/cubux/audit/AutoBackupManager.java

      - name: Validate 3.0.4 rules
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root=Path('.')

          def read(p):
              return (root/p).read_text(encoding='utf-8')

          def need(cond,msg):
              if not cond:
                  raise SystemExit('VALIDATION FAILED: '+msg)

          ma=read('app/src/main/java/com/cubux/audit/MainActivity.java')
          sh=read('app/src/main/java/com/cubux/audit/StableHistoryLoader.java')
          mh=read('app/src/main/java/com/cubux/audit/MonthlyHistoryProbe.java')
          lc=read('app/src/main/java/com/cubux/audit/LightCheckEngine.java')
          cl=read('app/src/main/java/com/cubux/audit/CubuxLoader.java')
          co=read('app/src/main/java/com/cubux/audit/AuditCoordinator.java')
          dp=read('app/src/main/java/com/cubux/audit/DelayProfile.java')
          bg=read('app/build.gradle')

          need(
              "versionName '3.0.4'" in bg
              and 'versionCode 39' in bg,
              'version mismatch'
          )

          need(
              'Cubux Security 3.0.4' in ma,
              'UI version mismatch'
          )

          need(
              'detailsText.setMinLines(6)' in ma
              and 'detailsText.setMaxLines(6)' in ma,
              '6-line status block missing'
          )

          need(
              '"STABILITY_START".equals(stage)) return Math.max(current, 3)' in ma,
              'progress 87% startup bug not fixed'
          )

          need(
              'MONTHLY_CONTROL_VERIFY' in ma
              and 'STABILITY_EMERGENCY' in ma,
              'monthly stability UI stages missing'
          )

          need(
              'class MonthlyHistoryProbe' in mh
              and 'loadProbeSignature()' in cl,
              'monthly probe missing'
          )

          need(
              'verifyWithMonthlyProbe' in sh
              and 'stableMonthlyControl' in sh,
              'monthly full-check stability flow missing'
          )

          need(
              'fallbackDoubleRead' in sh
              and 'STABILITY_EMERGENCY' in sh,
              'emergency safety fallback missing'
          )

          need(
              'runMonthlyControl' in lc
              and 'light_month_probe' in lc,
              'light monthly control missing'
          )

          need(
              'LIGHT_BASELINE_MIGRATION' in lc
              and 'matchesLocalBaseline' in lc,
              'upgrade baseline migration missing'
          )

          need(
              'getStableMonthlyControl' in co
              and 'light_month_probe' in co,
              'reuse of full-check monthly baseline missing'
          )

          need(
              'MIN_MS = 500L' in dp
              and 'MAX_MS = 10000L' in dp,
              '0.5-10 second delay range missing'
          )

          need(
              'String to=TimeUtil.yesterday();' in co,
              'today must remain excluded from scans'
          )

          print('PASS: Cubux Security 3.0.4 static rules')
          PYCODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-tests \
            com.cubux.audit.DelayProfileTest

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-tests \
            com.cubux.audit.AuditControlTimerTest

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-tests \
            com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"

          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.4-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
