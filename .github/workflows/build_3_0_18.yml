name: Cubux Security 3.0.18 Day Control and Event Center Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.18
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_18_INSTALL.zip
          rm -rf /tmp/cubux318
          mkdir -p /tmp/cubux318
          unzip -q CubuxAudit_3_0_18_INSTALL.zip -d /tmp/cubux318
          cp -a /tmp/cubux318/. .

      - name: Validate staged 3.0.18 scope
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java
          DB=app/src/main/java/com/cubux/audit/AuditDb.java
          DC=app/src/main/java/com/cubux/audit/DayControlScheduler.java
          DS=app/src/main/java/com/cubux/audit/DayControlService.java
          DE=app/src/main/java/com/cubux/audit/DayControlEngine.java
          AC=app/src/main/java/com/cubux/audit/AuditCoordinator.java
          MF=app/src/main/AndroidManifest.xml

          grep -Fq "versionName '3.0.18'" app/build.gradle
          grep -Fq 'versionCode 53' app/build.gradle
          grep -Fq 'Cubux Security 3.0.18' "$MA"

          # Day-control UI replaces Reports.
          grep -Fq '"Сегодня"' "$MA"
          grep -Fq 'Контроль дня' "$MA"
          grep -Fq 'Не влияет на основную проверку и эталонную базу' "$MA"
          grep -Fq 'История изменений' "$MA"
          grep -Fq 'Почасовой скан: 00:30 — 23:30' "$MA"
          grep -Fq 'Финальный контроль: 23:59' "$MA"
          grep -Fq 'Проверить сейчас' "$MA"
          grep -Fq 'dayEventTypeFilter' "$MA"
          grep -Fq 'showDayEventDetails' "$MA"

          # Independent day tables/history.
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_snapshot' "$DB"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_events' "$DB"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_scans' "$DB"
          grep -Fq 'applyDayScan' "$DB"
          grep -Fq 'applyDayScan(String day,Map<String,String>current,String now) throws Exception' "$DB"
          grep -Fq 'daySummary' "$DB"
          grep -Fq 'dayEvents' "$DB"
          grep -Fq 'event_type' "$DB"

          # Hourly schedule + 23:59 final scan.
          grep -Fq '00:30, 01:30 ... 23:30' "$DC"
          grep -Fq 'candidate.set(Calendar.MINUTE, 59)' "$DC"
          grep -Fq 'DayControlService.startScheduled' app/src/main/java/com/cubux/audit/DayControlAlarmReceiver.java
          grep -Fq 'DayControlScheduler.scheduleNext' app/src/main/java/com/cubux/audit/BootReceiver.java
          grep -Fq 'new DayControlEngine(app).scan(day)' "$DS"
          grep -Fq 'CubuxLoader(client, team, scanDay, scanDay' "$DE"

          # Event center: unread queue, no overwrite.
          grep -Fq 'Центр событий' "$MA"
          grep -Fq 'Все","Важные","Проверки","Сегодня","Система' "$MA"
          grep -Fq 'Отметить всё просмотренным' "$MA"
          grep -Fq 'unreadEvents' "$DB"
          grep -Fq 'markEventSeen' "$DB"
          grep -Fq 'markAllEventsSeen' "$DB"
          grep -Fq 'seen INTEGER NOT NULL DEFAULT 0' "$DB"
          grep -Fq 'За сегодня изменена 1 запись' "$DS"
          grep -Fq 'За сегодня удалена 1 запись' "$DS"

          # Android components are declared.
          grep -Fq '.DayControlService' "$MF"
          grep -Fq '.DayControlAlarmReceiver' "$MF"

          # 3.0.17 journal/history remains present.
          grep -Fq 'Требует решения' "$MA"
          grep -Fq 'Решено' "$MA"
          grep -Fq 'showCheckHistoryPage' "$MA"
          grep -Fq 'resolution_status' "$DB"

          # Core closed-day audit safety must remain unchanged.
          grep -Fq 'String to=TimeUtil.yesterday();' "$AC"
          grep -Fq 'MIN_MS = 500L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'NoInternetException' app/src/main/java/com/cubux/audit/CubuxClient.java
          grep -Fq 'waitForInternet()' app/src/main/java/com/cubux/audit/CubuxClient.java

          # Backup redesign is deliberately deferred to 3.0.19.
          if grep -Fq 'AutoBackupScheduler' "$MA" || \
             grep -Fq 'Хранить последние' "$MA" || \
             grep -Fq 'Изменить папку' "$MA"; then
            echo 'VALIDATION FAILED: 3.0.19 backup redesign leaked into 3.0.18'
            exit 1
          fi

          echo 'PASS: Cubux Security 3.0.18 Day Control + Event Center scope'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests
          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.18-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
