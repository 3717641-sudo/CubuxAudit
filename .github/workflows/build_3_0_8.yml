name: Cubux Security 3.0.8 UI Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.8
        shell: bash
        run: |
          set -e
          test -f CubuxAudit_3_0_8_INSTALL.zip
          rm -rf /tmp/cubux308
          mkdir -p /tmp/cubux308
          unzip -q CubuxAudit_3_0_8_INSTALL.zip -d /tmp/cubux308
          cp -a /tmp/cubux308/. .

      - name: Validate 3.0.8 design and safety rules
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root=Path('.')
          def read(p): return (root/p).read_text(encoding='utf-8')
          def need(c,m):
              if not c: raise SystemExit('VALIDATION FAILED: '+m)

          bg=read('app/build.gradle')
          st=read('app/src/main/res/values/styles.xml')
          mf=read('app/src/main/AndroidManifest.xml')
          ma=read('app/src/main/java/com/cubux/audit/MainActivity.java')
          db=read('app/src/main/java/com/cubux/audit/AuditDb.java')
          cs=read('app/src/main/java/com/cubux/audit/CheckScheduler.java')
          ar=read('app/src/main/java/com/cubux/audit/AuditActionReceiver.java')
          af=read('app/src/main/java/com/cubux/audit/AuditForegroundService.java')
          ac=read('app/src/main/java/com/cubux/audit/AuditCoordinator.java')
          sh=read('app/src/main/java/com/cubux/audit/StableHistoryLoader.java')
          lc=read('app/src/main/java/com/cubux/audit/LightCheckEngine.java')
          dp=read('app/src/main/java/com/cubux/audit/DelayProfile.java')
          cc=read('app/src/main/java/com/cubux/audit/CubuxClient.java')
          ss=read('app/src/main/java/com/cubux/audit/CheckStatusStore.java')

          need("versionName '3.0.8'" in bg and 'versionCode 43' in bg, 'version mismatch')
          need('Cubux Security 3.0.8' in ma, 'UI version mismatch')

          need('header.setBackgroundColor(Color.WHITE)' in ma, 'compact white header missing')
          need('Защита активна' in ma, 'protection status pill missing')
          need('Color.rgb(246, 249, 252)' in ma, 'light page background missing')
          need('Color.rgb(0, 168, 190)' in ma or 'Color.rgb(0,169,190)' in ma,
               'teal navigation accent missing')
          need('nav.setBackground(bg)' in ma and 'Color.WHITE' in ma,
               'white bottom navigation missing')

          for label in ['Главная','Проверка','Банк','Отчёты','Журнал','Настройки']:
              need(label in ma, 'navigation label missing: '+label)

          need('Система под контролем' in ma and 'Требуется внимание' in ma,
               'dynamic status card missing')
          need('Закрытые периоды' in ma and 'Резервная копия' in ma
               and 'Восстановление' in ma and 'Автопроверка' in ma,
               'home quick-action grid missing')
          need('Проверка банковской выписки' in ma and 'Выбрать файл выписки' in ma,
               'bank design missing')
          need('День' in ma and 'Неделя' in ma and 'Месяц' in ma and 'Год' in ma,
               'report period tabs missing')
          need('Журнал изменений' in ma and 'Поиск по описанию, сумме, категории' in ma,
               'journal design missing')
          need('settingsSection' in ma and 'Данные и безопасность' in ma,
               'settings card design missing')
          need('detailsText.setMinLines(8)' in ma and 'detailsText.setMaxLines(8)' in ma,
               '8-line live status missing')

          need('pauseButton.setVisibility(View.GONE)' in ma
               and 'stopButton.setVisibility(View.GONE)' in ma,
               'pause/stop pre-run visibility rule missing')

          need('dispatchTouchEvent(MotionEvent ev)' in ma
               and 'currentPage + 1' in ma and 'currentPage - 1' in ma,
               'swipe navigation missing')

          need('<item name="android:windowLightStatusBar">true</item>' in st,
               'light status bar missing')

          need('DB_VERSION=7' in db
               and 'CREATE TABLE IF NOT EXISTS app_events' in db,
               'event DB missing')
          need('public void appEvent' in db and 'public String eventsText()' in db,
               'event center API missing')
          need('db.appEvent' in ss and 'last_check_total' in ss,
               'check status persistence missing')

          need('android.permission.SCHEDULE_EXACT_ALARM' in mf
               and 'android.permission.RECEIVE_BOOT_COMPLETED' in mf,
               'schedule/boot permissions missing')
          need('setExactAndAllowWhileIdle' in cs and 'scheduleStartup' in cs,
               'automatic schedule missing')
          need('AuditForegroundService.startScheduled' in
               read('app/src/main/java/com/cubux/audit/ScheduledAlarmReceiver.java'),
               'scheduled foreground start missing')
          need('AuditControlRegistry.attach(control,mode)' in af
               and 'AuditControlRegistry.current()' in ma,
               'shared pause/stop control missing')
          need('c.pause()' in ar and 'c.resume()' in ar and 'c.stop()' in ar,
               'notification controls missing')
          need('AuditRunGate.tryAcquire()' in ac and 'AuditRunGate.release()' in ac,
               'single-check gate missing')

          need('String to=TimeUtil.yesterday();' in ac,
               'today must remain excluded')
          need('verifyWithMonthlyProbe' in sh and 'runMonthlyControl' in lc,
               'history stability logic missing')
          need('MIN_MS = 500L' in dp and 'MAX_MS = 10000L' in dp,
               'request delay bounds missing')
          need('NoInternetException' in cc and 'waitForInternet()' in cc,
               'offline recovery missing')
          need('yesterday_changed_during_scan' in sh and 'YESTERDAY_CHANGED' in sh,
               'yesterday warning missing')

          print('PASS: Cubux Security 3.0.8 design + safety rules')
          PYCODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cubux-tests
          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cubux-time-tests
          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-time-tests com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.8-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
