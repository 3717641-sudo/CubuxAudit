name: Cubux Security 3.0.9 Reference UI Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.9
        shell: bash
        run: |
          set -e
          test -f CubuxAudit_3_0_9_INSTALL.zip
          rm -rf /tmp/cubux309
          mkdir -p /tmp/cubux309
          unzip -q CubuxAudit_3_0_9_INSTALL.zip -d /tmp/cubux309
          cp -a /tmp/cubux309/. .

      - name: Validate 3.0.9 reference design and safety rules
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          root=Path('.')
          def read(p): return (root/p).read_text(encoding='utf-8')
          def need(c,m):
              if not c: raise SystemExit('VALIDATION FAILED: '+m)

          bg=read('app/build.gradle')
          st=read('app/src/main/res/values/styles.xml')
          mf=read('app/src/main/AndroidManifest.xml')
          ma=read('app/src/main/java/com/cubux/audit/MainActivity.java')
          db=read('app/src/main/java/com/cubux/audit/AuditDb.java')
          cs=read('app/src/main/java/com/cubux/audit/CheckScheduler.java')
          ar=read('app/src/main/java/com/cubux/audit/AuditActionReceiver.java')
          af=read('app/src/main/java/com/cubux/audit/AuditForegroundService.java')
          ac=read('app/src/main/java/com/cubux/audit/AuditCoordinator.java')
          sh=read('app/src/main/java/com/cubux/audit/StableHistoryLoader.java')
          lc=read('app/src/main/java/com/cubux/audit/LightCheckEngine.java')
          dp=read('app/src/main/java/com/cubux/audit/DelayProfile.java')
          cc=read('app/src/main/java/com/cubux/audit/CubuxClient.java')
          ss=read('app/src/main/java/com/cubux/audit/CheckStatusStore.java')

          need("versionName '3.0.9'" in bg and 'versionCode 44' in bg, 'version mismatch')
          need('Cubux Security 3.0.9' in ma, 'UI version mismatch')

          need('screen.addView(buildHeader(), new LinearLayout.LayoutParams' in ma and 'dp(48)' in ma,
               'compact 48dp header missing')
          need('ViewGroup.LayoutParams.MATCH_PARENT, dp(54)' in ma,
               'compact 54dp bottom navigation missing')
          need('header.setBackgroundColor(Color.WHITE)' in ma, 'white header missing')
          need('Защита активна' in ma, 'protection pill missing')
          need('Color.rgb(247, 250, 253)' in ma, 'reference page background missing')
          need('sans-serif-medium' in ma, 'reference typography missing')
          need('RelativeSizeSpan' in ma and 'ForegroundColorSpan' in ma,
               'two-level informer typography missing')

          for label in ['Главная','Проверка','Банк','Отчёты','Журнал','Настройки']:
              need(label in ma, 'navigation item missing: '+label)

          need('Система под контролем' in ma and 'Требуется внимание' in ma,
               'dynamic informer missing')
          need('Закрытые периоды' in ma and 'Резервная копия' in ma and
               'Восстановление' in ma and 'Автопроверка' in ma,
               'four home quick cards missing')

          need('detailsText.setMinLines(8)' in ma and
               'detailsText.setMaxLines(8)' in ma,
               '8 live status lines missing')
          need('Текущий этап проверки' in ma and 'new TextView[8]' in ma,
               '8-stage checklist missing')

          for stage in [
              'Подключение к Cubux',
              'Получение списка периодов',
              'Загрузка данных',
              'Сравнение с базой',
              'Проверка изменений',
              'Запись результатов',
              'Формирование отчёта',
              'Завершение проверки'
          ]:
              need(stage in ma, 'checklist stage missing: '+stage)

          need('class ChangeChartView' in ma and 'canvas.drawRect' in ma,
               'report chart missing')

          need('String to=TimeUtil.yesterday();' in ac,
               'today must remain excluded')
          need('verifyWithMonthlyProbe' in sh and 'runMonthlyControl' in lc,
               'history stability logic missing')
          need('MIN_MS = 500L' in dp and 'MAX_MS = 10000L' in dp,
               'request delay bounds missing')
          need('NoInternetException' in cc and 'waitForInternet()' in cc,
               'offline recovery missing')

          print('PASS: Cubux Security 3.0.9 reference UI + safety rules')
          PYCODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e
          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.9-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
