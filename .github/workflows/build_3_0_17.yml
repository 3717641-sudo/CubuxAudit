name: Cubux Security 3.0.17 Journal and History Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.17
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_17_INSTALL.zip
          rm -rf /tmp/cubux317
          mkdir -p /tmp/cubux317
          unzip -q CubuxAudit_3_0_17_INSTALL.zip -d /tmp/cubux317
          cp -a /tmp/cubux317/. .

      - name: Validate staged 3.0.17 scope
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java
          DB=app/src/main/java/com/cubux/audit/AuditDb.java
          AC=app/src/main/java/com/cubux/audit/AuditCoordinator.java

          grep -Fq "versionName '3.0.17'" app/build.gradle
          grep -Fq 'versionCode 52' app/build.gradle
          grep -Fq 'Cubux Security 3.0.17' "$MA"

          grep -Fq 'Требует решения' "$MA"
          grep -Fq 'Решено' "$MA"
          grep -Fq '✓  Вопрос решён' "$MA"
          grep -Fq 'Комментарий к решению' "$MA"
          grep -Fq 'journalResolutionFilter' "$MA"
          grep -Fq 'journalTypeFilter' "$MA"
          grep -Fq 'showChangeDetails' "$MA"

          grep -Fq 'Поиск по дате или № проверки' "$MA"
          grep -Fq 'С изменениями' "$MA"
          grep -Fq 'Ошибки' "$MA"
          grep -Fq 'Остановленные' "$MA"
          grep -Fq 'Показать ещё' "$MA"
          grep -Fq 'historyLimit+=20' "$MA"
          grep -Fq 'showCheckHistoryPage' "$MA"

          grep -Fq 'resolution_status' "$DB"
          grep -Fq 'resolved_at' "$DB"
          grep -Fq 'resolution_note' "$DB"
          grep -Fq 'resolveChange' "$DB"
          grep -Fq 'reopenChange' "$DB"
          grep -Fq 'unresolvedChangeCount' "$DB"
          grep -Fq 'runsPage' "$DB"
          grep -Fq 'mode TEXT' "$DB"
          grep -Fq 'db.setRunMode(runId,mode)' "$AC"

          # Reports and backup redesigns are deliberately deferred to 3.0.18/3.0.19.
          grep -Fq 'Аналитика и статистика изменений' "$MA"
          grep -Fq 'Экспорт базы\nи SHA-256' "$MA"
          grep -Fq 'Импорт из\nрезервной копии' "$MA"

          if grep -Fq 'AutoBackupScheduler' "$MA" || \
             grep -Fq 'AutoBackupManager.enabled' "$MA" || \
             grep -Fq 'AutoBackupManager.intervalDays' "$MA" || \
             grep -Fq 'confirmRestore(uri)' "$MA"; then
            echo 'VALIDATION FAILED: unfinished backup/restore code leaked into 3.0.17'
            exit 1
          fi

          grep -Fq 'String to=TimeUtil.yesterday();' "$AC"
          grep -Fq 'MIN_MS = 500L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'NoInternetException' app/src/main/java/com/cubux/audit/CubuxClient.java
          grep -Fq 'waitForInternet()' app/src/main/java/com/cubux/audit/CubuxClient.java

          echo 'PASS: Cubux Security 3.0.17 Journal + History scope'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"

          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.17-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
