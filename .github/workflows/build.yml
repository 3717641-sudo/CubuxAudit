name: Cubux 2.9 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack new version
        run: |
          if [ -f CubuxAudit_2_9_INSTALL.zip ]; then
            mkdir -p /tmp/cubux29
            unzip -q CubuxAudit_2_9_INSTALL.zip -d /tmp/cubux29
            cp -a /tmp/cubux29/. .
          fi
          test -f app/src/main/java/com/cubux/audit/GentleServerGate.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test server protection
        run: |
          mkdir -p /tmp/cubux-tests
          javac -d /tmp/cubux-tests app/src/main/java/com/cubux/audit/{GentleServerGate,AuditControl,AuditProgressListener,CubuxClient,CubuxAuthClient}.java tests/GentleServerGateTest.java
          java -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Build signed APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        run: |
          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CubuxAudit-2.9-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
