name: Cubux 2.9 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Cubux 2.9
        shell: bash
        run: |
          set -euo pipefail

          if [ -f CubuxAudit_2_9_INSTALL.zip ]; then
            mkdir -p "$RUNNER_TEMP/cubux29"
            unzip -q CubuxAudit_2_9_INSTALL.zip -d "$RUNNER_TEMP/cubux29"
            cp -a "$RUNNER_TEMP/cubux29/." .
          fi

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/cubux/audit/GentleServerGate.java

      - name: Fix LightCheckEngine compilation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/cubux/audit/LightCheckEngine.java")
          text = p.read_text(encoding="utf-8")

          old = "private Map<String,String> monthHashes(Object root){"
          new = "private Map<String,String> monthHashes(Object root) throws Exception {"

          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("Unexpected LightCheckEngine source: patch not applied")

          print("LightCheckEngine fix verified")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test server protection
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/cubux-tests"

          javac -d "$RUNNER_TEMP/cubux-tests" \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/CubuxClient.java \
            app/src/main/java/com/cubux/audit/CubuxAuthClient.java \
            tests/GentleServerGateTest.java

          java -cp "$RUNNER_TEMP/cubux-tests" \
            com.cubux.audit.GentleServerGateTest

      - name: Build signed APK
        shell: bash
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            CUBUX_KEYSTORE_BASE64 \
            CUBUX_KEYSTORE_PASSWORD \
            CUBUX_KEY_ALIAS \
            CUBUX_KEY_PASSWORD
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing GitHub Secret: $secret_name"
              exit 1
            fi
          done

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon --console=plain assembleRelease

          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxAudit-2.9-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
