name: Cubux Security 3.0.15 Check UI Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.15
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_15_INSTALL.zip
          rm -rf /tmp/cubux315
          mkdir -p /tmp/cubux315
          unzip -q CubuxAudit_3_0_15_INSTALL.zip -d /tmp/cubux315
          cp -a /tmp/cubux315/. .

      - name: Validate 3.0.15 approved UI and safety rules
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java

          grep -Fq "versionName '3.0.15'" app/build.gradle
          grep -Fq "versionCode 50" app/build.gradle
          grep -Fq "Cubux Security 3.0.15" "$MA"

          grep -Fq 'db.recentRuns(4)' "$MA"
          grep -Fq 'homeAction(R.drawable.ic_closed_periods, "Закрытые периоды"' "$MA"
          grep -Fq 'homeAction(R.drawable.ic_clock, "Автопроверка"' "$MA"
          grep -Fq 'homeAction(R.drawable.ic_backup, "Резервная копия"' "$MA"
          grep -Fq 'homeAction(R.drawable.ic_restore, "Восстановление"' "$MA"

          grep -Fq 'private View buildCheckPage()' "$MA"
          grep -Fq 'buildRoundedProgressDrawable()' "$MA"
          grep -Fq 'GradientDrawable.Orientation.LEFT_RIGHT' "$MA"
          grep -Fq 'Color.rgb(0,194,113)' "$MA"
          grep -Fq 'new TextView[8]' "$MA"
          grep -Fq 'stageIconViews' "$MA"
          grep -Fq 'stageStatusViews' "$MA"
          grep -Fq 'icon.setText("✓")' "$MA"
          grep -Fq 'icon.setBackground(rounded(GREEN,20))' "$MA"
          grep -Fq 'icon.setBackground(rounded(BLUE,20))' "$MA"
          grep -Fq 'status.setText("В процессе")' "$MA"
          grep -Fq 'status.setText("Ожидание")' "$MA"

          grep -Fq 'Текущий этап:  Проверка завершена' "$MA"
          grep -Fq 'Проверка прошла успешно. Изменений не обнаружено.' "$MA"
          grep -Fq 'Найдены изменения: новые — ' "$MA"
          grep -Fq 'Проверка завершена с ошибкой' "$MA"

          grep -Fq 'auditButton.setVisibility(runningNow ? View.GONE : View.VISIBLE)' "$MA"
          grep -Fq 'fullAuditButton.setVisibility(runningNow ? View.GONE : View.VISIBLE)' "$MA"
          grep -Fq 'pauseButton.setVisibility(runningNow?View.VISIBLE:View.GONE)' "$MA"
          grep -Fq 'stopButton.setVisibility(runningNow?View.VISIBLE:View.GONE)' "$MA"

          grep -Fq 'String to=TimeUtil.yesterday();' \
            app/src/main/java/com/cubux/audit/AuditCoordinator.java
          grep -Fq 'verifyWithMonthlyProbe' \
            app/src/main/java/com/cubux/audit/StableHistoryLoader.java
          grep -Fq 'runMonthlyControl' \
            app/src/main/java/com/cubux/audit/LightCheckEngine.java
          grep -Fq 'MIN_MS = 500L' \
            app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' \
            app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'NoInternetException' \
            app/src/main/java/com/cubux/audit/CubuxClient.java
          grep -Fq 'waitForInternet()' \
            app/src/main/java/com/cubux/audit/CubuxClient.java

          echo 'PASS: Cubux Security 3.0.15 UI + safety validation'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-tests \
            com.cubux.audit.DelayProfileTest

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-tests \
            com.cubux.audit.AuditControlTimerTest

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-tests \
            com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"

          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.15-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
