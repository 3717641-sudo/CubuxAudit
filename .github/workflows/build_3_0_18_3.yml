name: Cubux Security 3.0.18.4 Home and Notifications Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Cubux Security 3.0.18.4
        shell: bash
        run: |
          set -euo pipefail
          test -f CubuxAudit_3_0_18_4_INSTALL.zip
          rm -rf /tmp/cubux3184
          mkdir -p /tmp/cubux3184
          unzip -q CubuxAudit_3_0_18_4_INSTALL.zip -d /tmp/cubux3184
          cp -a /tmp/cubux3184/. .

      - name: Validate 3.0.18.4 scope
        shell: bash
        run: |
          set -euo pipefail
          MA=app/src/main/java/com/cubux/audit/MainActivity.java
          DB=app/src/main/java/com/cubux/audit/AuditDb.java
          AF=app/src/main/java/com/cubux/audit/AuditForegroundService.java
          AR=app/src/main/java/com/cubux/audit/AuditActionReceiver.java
          NH=app/src/main/java/com/cubux/audit/NotificationHelper.java
          DS=app/src/main/java/com/cubux/audit/DayControlService.java
          DE=app/src/main/java/com/cubux/audit/DayControlEngine.java
          CL=app/src/main/java/com/cubux/audit/CubuxLoader.java
          AC=app/src/main/java/com/cubux/audit/AuditCoordinator.java

          grep -Fq "versionName '3.0.18.4'" app/build.gradle
          grep -Fq 'versionCode 57' app/build.gradle
          grep -Fq 'Cubux Security 3.0.18.4' "$MA"

          # Home design and informative action cards.
          grep -Fq 'Контроль периодов' "$MA"
          grep -Fq 'Расписание проверок' "$MA"
          grep -Fq 'Резервные копии' "$MA"
          grep -Fq 'homeStatusAction' "$MA"
          grep -Fq 'closedPeriodsHomeStatus' "$MA"
          grep -Fq 'scheduleHomeStatus' "$MA"
          grep -Fq 'backupHomeStatus' "$MA"

          # Closed-period screen is now informative and backed by real DB data.
          grep -Fq 'ClosureMonthSummary' "$DB"
          grep -Fq 'closedPeriodChangedCount' "$DB"
          grep -Fq 'closureMonths' "$DB"
          grep -Fq 'Все закрытые периоды под контролем' "$MA"
          grep -Fq 'Есть изменения в закрытых периодах' "$MA"

          # Schedule screen shows both quick and full schedules and next launch.
          grep -Fq 'Быстрая проверка' "$MA"
          grep -Fq 'Полная проверка' "$MA"
          grep -Fq 'Следующая проверка' "$MA"
          grep -Fq 'Последний автозапуск' "$MA"
          grep -Fq 'daysText' "$MA"

          # Day-control screen must refresh itself immediately after a scan finishes.
          grep -Fq 'dayScanWasRunning' "$MA"
          grep -Fq 'dayLastRenderedScan' "$MA"
          grep -Fq 'completedNow' "$MA"
          grep -Fq 'switchPage(PAGE_REPORTS)' "$MA"

          # Compact running notification: Pause OR Resume, plus Stop.
          grep -Fq 'Проверка на паузе' "$AF"
          grep -Fq 'modeTitle' "$AF"
          grep -Fq 'if(paused)b.addAction' "$AF"
          grep -Fq 'else b.addAction' "$AF"
          grep -Fq 'Останавливаю проверку…' "$AR"

          # Concise result/day-control notifications.
          grep -Fq 'showDayControlAlert' "$NH"
          grep -Fq 'showDayControlError' "$NH"
          grep -Fq 'clearDayControlWarning' "$NH"
          grep -Fq 'Дневной контроль не выполнен' "$NH"
          grep -Fq 'NotificationHelper.showDayControlAlert' "$DS"
          grep -Fq 'NotificationHelper.showDayControlError' "$DS"

          # Preserve empty-current-day fix from 3.0.18.3.
          grep -Fq 'if (total < 0 || pages < 0 || (total > 0 && pages < 1))' "$CL"
          grep -Fq 'if (total == 0)' "$CL"
          grep -Fq 'return new Result(0, 0, all);' "$CL"

          # Preserve day-control progress and isolation.
          grep -Fq 'Сканирование…' "$MA"
          grep -Fq 'Не удалось загрузить данные' "$MA"
          grep -Fq 'RUNNING.compareAndSet(false, true)' "$DS"
          grep -Fq 'Подключение к Cubux' "$DE"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_snapshot' "$DB"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_events' "$DB"
          grep -Fq 'CREATE TABLE IF NOT EXISTS day_scans' "$DB"

          # Preserve safe startup migration and stop recovery.
          grep -Fq 'ALTER TABLE app_events ADD COLUMN seen INTEGER NOT NULL DEFAULT 0' "$DB"
          grep -Fq 'CREATE INDEX IF NOT EXISTS idx_app_events_seen ON app_events(seen,id)' "$DB"
          grep -Fq 'stopStaleRunningRuns' "$DB"
          grep -Fq 'recoverStoppedAuditUi' "$MA"
          grep -Fq 'AuditRunGate.release();' "$AC"

          # Main audit must still never scan today.
          grep -Fq 'String to=TimeUtil.yesterday();' "$AC"
          grep -Fq 'MIN_MS = 500L' app/src/main/java/com/cubux/audit/DelayProfile.java
          grep -Fq 'MAX_MS = 10000L' app/src/main/java/com/cubux/audit/DelayProfile.java

          if grep -Fq 'DROP TABLE' "$DB"; then
            echo 'VALIDATION FAILED: destructive database migration found'
            exit 1
          fi

          echo 'PASS: Cubux Security 3.0.18.4 scope validated'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test delay, timer and request protection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-tests
          mkdir -p /tmp/cubux-tests

          javac -encoding UTF-8 -d /tmp/cubux-tests \
            app/src/main/java/com/cubux/audit/DelayProfile.java \
            app/src/main/java/com/cubux/audit/AuditControl.java \
            app/src/main/java/com/cubux/audit/AuditControlRegistry.java \
            app/src/main/java/com/cubux/audit/AuditProgressListener.java \
            app/src/main/java/com/cubux/audit/GentleServerGate.java \
            tests/DelayProfileTest.java \
            tests/AuditControlTimerTest.java \
            tests/GentleServerGateTest.java

          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.DelayProfileTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.AuditControlTimerTest
          java -Dfile.encoding=UTF-8 -cp /tmp/cubux-tests com.cubux.audit.GentleServerGateTest

      - name: Test closed-day cutoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cubux-time-tests
          mkdir -p /tmp/cubux-time-tests

          javac -encoding UTF-8 -d /tmp/cubux-time-tests \
            app/src/main/java/com/cubux/audit/TimeUtil.java \
            tests/ClosedDayRulesTest.java

          java -Dfile.encoding=UTF-8 \
            -cp /tmp/cubux-time-tests \
            com.cubux.audit.ClosedDayRulesTest

      - name: Test legacy event migration ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          db=sqlite3.connect(':memory:')
          db.execute('CREATE TABLE app_events(id INTEGER PRIMARY KEY AUTOINCREMENT,created_at TEXT NOT NULL,level TEXT NOT NULL,source TEXT NOT NULL,message TEXT NOT NULL)')
          db.execute('ALTER TABLE app_events ADD COLUMN seen INTEGER NOT NULL DEFAULT 0')
          db.execute("ALTER TABLE app_events ADD COLUMN category TEXT NOT NULL DEFAULT 'SYSTEM'")
          db.execute("ALTER TABLE app_events ADD COLUMN action TEXT NOT NULL DEFAULT 'EVENTS'")
          db.execute('CREATE INDEX idx_app_events_seen ON app_events(seen,id)')
          print('PASS: legacy app_events migration order')
          PY

      - name: Build signed release APK
        env:
          CUBUX_KEYSTORE_BASE64: ${{ secrets.CUBUX_KEYSTORE_BASE64 }}
          CUBUX_KEYSTORE_PASSWORD: ${{ secrets.CUBUX_KEYSTORE_PASSWORD }}
          CUBUX_KEY_ALIAS: ${{ secrets.CUBUX_KEY_ALIAS }}
          CUBUX_KEY_PASSWORD: ${{ secrets.CUBUX_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CUBUX_KEYSTORE_BASE64"
          test -n "$CUBUX_KEYSTORE_PASSWORD"
          test -n "$CUBUX_KEY_ALIAS"
          test -n "$CUBUX_KEY_PASSWORD"

          export CUBUX_KEYSTORE_FILE="$RUNNER_TEMP/cubux-release.jks"
          trap 'rm -f "$CUBUX_KEYSTORE_FILE"' EXIT

          printf '%s' "$CUBUX_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$CUBUX_KEYSTORE_FILE"

          test -s "$CUBUX_KEYSTORE_FILE"
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubuxSecurity-3.0.18.4-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
